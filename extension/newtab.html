<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
  <script src="settings.js" defer></script>
  <script src="pet.js" defer></script>
</head>
<body>
  <main>
    <form action="https://www.google.com/search" method="get" role="search">
      <label for="search-box">Search Google</label>
      <div class="search">
        <input id="search-box" name="q" type="search" placeholder="Search Google" required>
        <button type="submit">Search</button>
      </div>
    </form>
  </main>
</body>
</html>
